name: Deploy Web Dashboard

on:
  push:
    branches: [main]

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Copy backend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          source: "server/*"
          target: "/opt/archipelago/web/server/"
          strip_components: 1

      - name: Copy built frontend to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          source: "frontend/dist/**"
          target: "/opt/archipelago/web/frontend/"
          strip_components: 1

      - name: Copy launcher script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          source: "scripts/start.sh"
          target: "/opt/archipelago/web/scripts/"
          strip_components: 1

      - name: Install deps + restart
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 2222
          script: |
            set -e
            WEB_DIR=/opt/archipelago/web
            VENV=$WEB_DIR/.venv
            chmod +x $WEB_DIR/scripts/start.sh
            if [ ! -x "$VENV/bin/python" ]; then
              python3 -m venv "$VENV"
              "$VENV/bin/pip" install --upgrade pip
            fi
            "$VENV/bin/pip" install -r $WEB_DIR/server/requirements.txt
            rm -f /opt/archipelago/death_leaderboard.json
            tmux kill-session -t archipelago-web 2>/dev/null || true
            $WEB_DIR/scripts/start.sh
