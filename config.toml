# ─────────────────────────────────────────────────────────────────────────────
# Archipelago Web Dashboard - host configuration
#
# Edit this file to control your deployment, then run ./run.sh (macOS/Linux) or
# run.bat (Windows). Every value is optional: anything you delete falls back to
# a sensible default. Comments start with '#'.
# ─────────────────────────────────────────────────────────────────────────────

[server]
ap_host = "localhost"          # host of your Archipelago server
ap_port = 38281                # its port
web_port = 8080                # the port THIS dashboard listens on
bind = "127.0.0.1"             # use "0.0.0.0" to allow other devices on your LAN
# Folder scanned for the newest *.archipelago file, just drop your multiworld-generated file in here.
# Can also be a direct path to one file.
# You can also put your host.yaml alongside it so hint cost / password are picked up.
multiworld_dir = "./multiworld"
# password = ""                # optional; better to let it read from host.yaml if set there

# Used ONLY when no host.yaml is found next to your .archipelago file;
# you're not hosting the multiworld yourself, just watching one that's running
# on someone else's server. Ignored entirely if a local host.yaml is present.
[server.remote]
host = ""              # e.g. "archipelago.gg", leave blank if you host locally
port = 38281
password = ""          # room password, if the remote server has one
tls = true              # public rooms (archipelago.gg included) need this on; turn off only for a plain ws:// remote server

[paths] # Ideally shouldn't be touched, but you still can, it's supposed to work
assets_dir = "./assets"        # drop custom images here (served under /host/)
data_dir = "./data"            # where death / item / hint-tag logs are written
# host_yaml = ""               # optional explicit path; default: <multiworld_dir>/host.yaml
hall_of_fame_dir = "./hall-of-fame"  # drop images here + list them in entries.toml

[branding]
hero_title   = "ArchipelaGoats"     # big headline on the dashboard hero
hero_image   = "banner.png"         # decorative image (drop it in assets_dir); "" to hide
# How far the shadow-like fade into the navy band reaches into the image
# (its left edge). 0 = barely faded, nearly the whole image shows
#1 = a long, soft transition.
hero_image_fade = 0.35
loading_name = "ArchipelaGoats"     # wordmark on the loading splash

[footer]
left  = "archipelago · nguengant.fr"
right = "Have fun guys :)"

[features]
hall_of_fame      = true       # show the Hall of Fame page + nav link
death_leaderboard = true       # show the death leaderboard on the dashboard
constellation     = true       # show the multiworld constellation map

# Hint tags players can pin on hints. Toggle built-ins by removing them, or add your own.
# `blocked_tag` designates which tag drives the dashboard "BKed checks" panel, set it to "" to hide that panel entirely.
[hints]
blocked_tag = "bked"

[[hints.tags]]
id = "bked"
label = "BKed"
label_fr = "BKed"
emoji = "🍔"

[[hints.tags]]
id = "mandatory"
label = "Mandatory"
label_fr = "Obligatoire"

[[hints.tags]]
id = "comfort"
label = "Comfort"
label_fr = "Confort"
